<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NITEXA Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
 

    <div class="join-screen" id="joinScreen">
      <div class="join-card">
        <div class="join-logo">
          <div class="logo-mark">N</div>
          <span>NITEXA</span>
        </div>
        <h1 class="join-title">Drop into<br /><em>the chat.</em></h1>
        <p class="join-sub">Real-time. No signup. Just you.</p>
 
        <div class="input-group">
          <input
            type="text"
            id="usernameInput"
            class="username-input"
            placeholder="Enter your name..."
            maxlength="20"
            autocomplete="off"
          />
          <button class="join-btn" id="joinBtn">
            <span>Join</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
        <p class="join-hint" id="joinHint"></p>
      </div>
      <div class="join-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
      </div>
    </div>
 
    <!-- ═══════════════════════════════════
         CHAT SCREEN
    ═══════════════════════════════════ -->
    <div class="chat-screen hidden" id="chatScreen">
 
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-mark sm">N</div>
          <span>NITEXA</span>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-info">
          <p class="sidebar-label">YOU</p>
          <p class="sidebar-username" id="sidebarUsername">—</p>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-info">
          <p class="sidebar-label">ROOM</p>
          <p class="sidebar-room">General</p>
          <span class="live-badge">LIVE</span>
        </div>
      </aside>
 
      <!-- Main Chat Area -->
      <main class="chat-main">
 
        <!-- Header -->
        <header class="chat-header">
          <div class="header-info">
            <div class="online-dot"></div>
            <span>General Room</span>
          </div>
          <p class="typing-indicator" id="typingIndicator"></p>
        </header>
 
        <!-- Messages -->
        <div class="messages-area" id="messagesArea">
          <div class="welcome-msg">
            <span>⚡ You're connected. Say something.</span>
          </div>
        </div>
 
        <!-- Input Bar -->
        <div class="input-bar">
          <input
            type="text"
            id="messageInput"
            class="message-input"
            placeholder="Type a message..."
            maxlength="500"
            autocomplete="off"
          />
          <button class="send-btn" id="sendBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
 
      </main>
    </div>
 
    <!-- Socket.IO client library (served by server automatically) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
  </body>
</html>
